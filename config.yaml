prefixes_excluded_from_indexing:
  - "." # Hidden files
  - "Index of " # Index files

patterns_excluded_from_indexing:
  - "^\\d{4}-\\d{2}-\\d{2}" # 2024-12-31
  - "^\\d{2}-\\d{2}-\\d{2}" # 20-12-31

# Whether the script will update wikilinks in obsidian markdown files after re-indexing
fix_weblinks: true

# Whether user approval is required before making any index updates
prompt_for_approval: false

# Whether JDex files are regenerated after fixing indexes
generate_jdex: true

# Whether notes are committed to git before fixing indexes, as a restore point
auto_commit: true

# Whether notes are pushed to their git remote after auto-committing
auto_push: true
